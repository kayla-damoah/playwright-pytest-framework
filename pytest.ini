[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    api: REST API tests (no browser)
    ui: browser tests driven by Playwright
    smoke: fast subset to run on every commit
